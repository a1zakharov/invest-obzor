<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#152b2a">
  <meta name="description" content="Локальный учёт инвестиционных портфелей, сделок и дивидендов. Все данные на вашем устройстве.">
  <title>Инвест Обзор — мой портфель</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/broker.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#overview"><span class="brand-mark">↗</span><span>инвест<span class="brand-light">обзор</span></span></a>
    <div class="workspace-label">МОЁ ПРОСТРАНСТВО</div>
    <label class="sr-only" for="portfolio-select">Текущий портфель</label>
    <select id="portfolio-select" aria-label="Текущий портфель"><option>Загрузка…</option></select>
    <button class="new-portfolio" data-action="new-portfolio">＋ Создать портфель</button>
    <div class="nav-label">ПОРТФЕЛЬ</div>
    <nav id="navigation" aria-label="Основная навигация"></nav>
    <div class="sidebar-bottom"><div class="local-card"><span class="status-dot"></span><div><strong>Локальное пространство</strong><span>Данные хранятся на вашем сервере</span></div></div><div class="version">Инвест Обзор <span>v1.0</span></div></div>
  </aside>
  <div class="layout">
    <header class="topbar"><div class="breadcrumb"><button id="menu-toggle" class="icon-button mobile-menu" aria-label="Открыть меню" aria-expanded="false">☰</button><span>Мои инвестиции</span><span class="crumb-divider">/</span><strong id="crumb">Обзор портфеля</strong></div><div class="topbar-right"><span class="offline-label"><span class="status-dot"></span> Локальные данные</span><button class="avatar" data-action="settings" aria-label="Настройки">ИО</button></div></header>
    <main id="main" tabindex="-1"><div class="loading">Загружаем ваше пространство…</div></main>
    <footer>Ваши инвестиции. Ваши данные.<span>Котировки и курсы обновляются вручную.</span></footer>
  </div>
  <dialog id="modal" aria-labelledby="dialog-title"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Для работы приложения включите JavaScript.</noscript>
</body>
</html>
