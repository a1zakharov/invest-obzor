<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Инвест Обзор</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main>
    <div class="brand"><span>↗</span> инвестобзор</div>
    <h1>Ваше пространство</h1>
    <p>Войдите, чтобы открыть портфели и счета.</p>
    <form id="login-form">
      <div id="login-error" role="alert"></div>
      <label>Логин<input name="username" autocomplete="username" required maxlength="80" autofocus></label>
      <label>Пароль<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <button type="submit">Войти</button>
    </form>
    <small>Данные хранятся на вашем сервере</small>
  </main>
</body>
</html>
